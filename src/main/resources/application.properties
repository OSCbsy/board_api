spring.application.name=board_api

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/boarddb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:board}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:board1234}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
